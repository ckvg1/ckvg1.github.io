<!DOCTYPE html>

  <body>
    <h1 style="font-size: 18pt">Sterowanie urządzeniami - parter</h1>

        />

        <!-- Przycisk do wszystkich świateł -->

      <div class="blokZarowki" id="blokZarowki0_1">

          <img
            id="wyj_l0_1_1"
            class="zarowka"
            src="../img_main/icony/bulb_on.png "
          />
        </a>
        <a onmousedown="wyslijTrue('l0_1_2')" style="cursor: pointer">
          <img
            id="wyj_l0_1_2"
            class="zarowka"
            src="../img_main/icony/bulb_on.png "
          />
        </a>
      </div>
      <div class="temperatura" id="t0_1">Błąd</div>
      <div class="nazwaBiura" id="nazwa0_1">
        sd fsd fs dfs df sdf sd fsd fsd fsd fsd
      </div>
      <div class="nazwaBiura drugaNazwa" id="nazwa0_1_2"></div>
      <div class="blokZarowki" id="blokZarowki0_2">
        <a onmousedown="wyslijTrue('l0_2_1')" style="cursor: pointer">
          <img
            id="wyj_l0_2_1"
            class="zarowka"
            src="../img_main/icony/bulb_on.png "
          />
        </a>

        <a onmousedown="wyslijTrue('l0_2_2')" style="cursor: pointer">
          <img
            id="wyj_l0_2_2"
            class="zarowka"
            src="../img_main/icony/bulb_on.png "
          />
        </a>
      </div>
      <div class="blokRolety" id="blokRolety0_2">
        <img
          id="b0_r2_1"
          class="strzalka"
          src="../img_main/icony/arrow.png"
          onmousedown="roletaWlacz('b0_r2_1')"
        />
        <img
          id="b0_r2_2"
          class="strzalka odwrot"
          src="../img_main/icony/arrow.png"
          onmousedown="roletaWlacz('b0_r2_2')"
        />
      </div>
      <div class="temperatura" id="t0_2">Błąd odczytu</div>
      <div class="nazwaBiura" id="nazwa0_2">
        sdf sdf sdf sdf sdf sdfsd fsd fsdf sdf
      </div>
      <div class="nazwaBiura drugaNazwa" id="nazwa0_2_2"></div>

      <div class="blokZarowki" id="blokZarowki0_3">
        <a onmousedown="wyslijTrue('l0_3_1')" style="cursor: pointer">
          <img
            id="wyj_l0_3_1"
            class="zarowka"
            src="../img_main/icony/bulb_on.png "
          />
        </a>
        <a onmousedown="wyslijTrue('l0_3_2')" style="cursor: pointer">
          <img
            id="wyj_l0_3_2"
            class="zarowka"
            src="../img_main/icony/bulb_on.png "
          />
        </a>
      </div>
      <div class="blokRolety" id="blokRolety0_3">
        <img
          id="b0_r3_1"
          class="strzalka"
          src="../img_main/icony/arrow.png"
          onmousedown="roletaWlacz('b0_r3_1')"
        />
        <img
          id="b0_r3_2"
          class="strzalka odwrot"
          src="../img_main/icony/arrow.png"
          onmousedown="roletaWlacz('b0_r3_2')"
        />
      </div>
      <div class="temperatura" id="t0_3">Błąd odczytu</div>
      <div class="nazwaBiura" id="nazwa0_3">
        sd fsd fsdfs dfsdf sdf sdf sdf sd fsd
      </div>
      <div class="nazwaBiura drugaNazwa" id="nazwa0_3_2"></div>
    </div>

    <script src="../js/dark_mode.js"></script>
    <script>
      main_image = document.getElementById("main_image");
      if (document.body.classList.contains("ciemny")) {
        main_image.src = "../img_main/mapy/rzut_parter-dark.png";
      }
    </script>
    <script src="sterowanie.js"></script>
    <script>
      // Pobranie i parsowanie ciasteczka
      const cookie = getCookie("pietro0");
      let parsedCookie = {};
      if (cookie) {
        parsedCookie = JSON.parse(cookie);
      } else {
        console.log("Ciasteczko nie istnieje!");
      }
      //console.log("Cookie string:", cookie);
      //console.log("Parsed cookie:", parsedCookie);
      // Ustawianie nazw w divach
      document.querySelectorAll(".nazwaBiura").forEach((div) => {
        const id = div.id.replace("nazwa", "");

        if (id.endsWith("_2") && id.length > 4) {
          // To jest "drugi" div — kopiujemy nazwę z poprzednika
          const mainId = id.replace("_2", "");
          div.innerText = parsedCookie["r" + mainId] || "Brak nazwy";
        } else {
          // To jest główny div — ustawiamy z cookies
          div.innerText = parsedCookie["r" + id] || "Brak nazwy";
        }
      });
    </script>
  </body>
</html>
