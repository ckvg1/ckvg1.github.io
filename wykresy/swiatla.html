<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Światła</title>
    <script src="js/heatmap.js"></script>
    <script src="js/plotly.min.js" charset="utf-8"></script>
    <link rel="icon" type="image/x-icon" href="../img_main/icon.png" />
    <link rel="stylesheet" href="../css_main/glowny.css" />
    <link rel="stylesheet" href="../css_main/swiatla.css" />
    <link rel="stylesheet" href="../css_main/czcionka.css" />
    <script src="../js/translations.js"></script>
  </head>
  <body class="jasny">
    <h1 id="dataInfoText">Data wykonania pomiaru (od-do):</h1>
    <h4 id="zakresDat">Używam danych z: Ostatnie 24 godziny</h4>
    <div id="formularz">
      <input type="datetime-local" id="data1" />
      -
      <input type="datetime-local" id="data2" />
      <select onchange="ustaw_pietro()" id="pietroSelect">
        <option value="0">Parter</option>
        <option value="1">Piętro 1</option>
        <option value="2">Piętro 2</option>
        <option value="3" selected>Piętro 3</option>
      </select>
      <button class="przycisk" onclick="filtruj()">Filtruj</button>
    </div>

    <div id="alertBox" class="oaerror danger" style="display: none"></div>
    <div id="myDiv" class="heatmap">
      <img id="mapa-swiatla" src="../img_main/mapy/swiatla-bg.png" />
    </div>
    <div id="myDiv2"></div>
    <div id="myPlot"></div>

    <script>
      "use strict";
      let pietro = 3;

      // Bazowe czujniki dla pięter 1+
      const bazoweCzujniki = [
        "1_1",
        "1_2",
        "2_1",
        "2_2",
        "3_1",
        "3_2",
        "4_1",
        "4_2",
        "5_1",
        "5_2",
        "6_1",
        "6_2",
        "7_1",
        "7_2",
      ];
      // Bazowe biura dla pięter 1+
      const bazoweBiura = ["1", "2", "3", "4", "5", "6", "7"];

      // Bazowe czujniki dla parteru
      const bazoweCzujnikiParter = ["1_1", "1_2", "2_1", "2_2", "3_1", "3_2"];
      // Bazowe biura dla parteru
      const bazoweBiuraParter = ["1", "2", "3"];

      function generujNazwyCzujnikow(pietro) {
        const lista = pietro == 0 ? bazoweCzujnikiParter : bazoweCzujniki;
        return lista.map((id) => `l${pietro}_${id}`);
      }
      function generujNazwyBiur(pietro) {
        const lista = pietro == 0 ? bazoweBiuraParter : bazoweBiura;
        return lista.map((id) => `r${pietro}_${id}`);
      }

      function ustaw_pietro() {
        pietro = document.getElementById("pietroSelect").value;
      }

      const zakresDat = document.getElementById("zakresDat");

      document.addEventListener("DOMContentLoaded", function () {
        generujWykres(`odczytaj_swiatla.php?wszystko=true&pietro=${pietro}`);
        generujHeatmape(`odczytaj_swiatla.php?pietro=${pietro}`);
        generujWykresKolowy(`odczytaj_swiatla.php?pietro=${pietro}`);
      });

      let cookie = getCookie("pietro" + pietro);
      let parsedCookie = JSON.parse(cookie);

      function filtruj() {
        const data1 = document.getElementById("data1").value
          ? new Date(document.getElementById("data1").value).toISOString()
          : null;
        const data2 = document.getElementById("data2").value
          ? new Date(document.getElementById("data2").value).toISOString()
          : null;

        if (data1 && data2) {
          zakresDat.innerHTML = `Używam danych z: ${formatDate(
            data1
          )} - ${formatDate(data2)}`;
          generujHeatmape(
            `odczytaj_swiatla.php?od=${toLocalISOString(
              new Date(data1)
            )}&do=${toLocalISOString(new Date(data2))}&pietro=${pietro}`
          );
          generujWykres(
            `odczytaj_swiatla.php?od=${toLocalISOString(
              new Date(data1)
            )}&do=${toLocalISOString(
              new Date(data2)
            )}&wszystko=true&pietro=${pietro}`
          );
          generujWykresKolowy(
            `odczytaj_swiatla.php?od=${toLocalISOString(
              new Date(data1)
            )}&do=${toLocalISOString(new Date(data2))}&pietro=${pietro}`
          );
        } else {
          zakresDat.innerHTML = `Używam danych z: Ostatnie 24 godziny`;
          generujHeatmape(`odczytaj_swiatla.php?pietro=${pietro}`);
          generujWykres(`odczytaj_swiatla.php?wszystko=true&pietro=${pietro}`);
          generujWykresKolowy(`odczytaj_swiatla.php?pietro=${pietro}`);
        }
        cookie = getCookie("pietro" + pietro);
        parsedCookie = JSON.parse(cookie);
      }

      function formatDate(dateString) {
        if (!dateString) return "Brak daty";
        let date = new Date(dateString);
        return `${String(date.getDate()).padStart(2, "0")}-${String(
          date.getMonth() + 1
        ).padStart(2, "0")}-${date.getFullYear()} ${String(
          date.getHours()
        ).padStart(2, "0")}:${String(date.getMinutes()).padStart(2, "0")}`;
      }

      function sprawdzCzySaDane(dane) {
        return dane.some(
          (wartosc) =>
            wartosc != 0 && wartosc != null && typeof wartosc === "number"
        );
      }

      const alertBox = document.getElementById("alertBox");

      function generujWykresKolowy(endpoint) {
        fetch(endpoint)
          .then((res) => res.json())
          .then((dane) => {
            if (!sprawdzCzySaDane(Object.values(dane))) {
              alertBox.style.display = "block";
              document.querySelector(".oaerror").innerHTML =
                "<strong>Uwaga</strong> - Brak danych do wyświetlenia wykresu. Proszę podać daty pomiaru.";
              translatePage(getCookie("lang") || "pl");
              document.getElementById("myDiv2").innerHTML = "";
              return;
            } else {
              alertBox.style.display = "none";
            }

            const isDark = localStorage.getItem("theme") === "ciemny-motyw";

            let biura = generujNazwyBiur(pietro);
            document.getElementById("myDiv2").innerHTML = "";
            let values = [];

            const czujniki = generujNazwyCzujnikow(pietro);
            for (let i = 0; i < czujniki.length; i += 2) {
              values.push(dane[czujniki[i]]);
            }

            const labelsNames = biura.map((key) => parsedCookie[key] || key);

            // Palety kolorów dopasowane do wykresów temperatur
            const lightColors = [
              "#d7263d",
              "#f46036",
              "#ffc43d",
              "#8c7ef2",
              "#1b998b",
              "#3f72af",
              "#ff9f1c",
              "#335c67",
              "#ffcad4",
              "#8479e1",
            ];
            const darkColors = [
              "#ff6361",
              "#bc5090",
              "#ffa600",
              "#58508d",
              "#2ca58d",
              "#4cc9f0",
              "#f72585",
              "#4361ee",
              "#ffd166",
              "#3a86ff",
            ];

            const sliceColors = (isDark ? darkColors : lightColors).slice(
              0,
              labelsNames.length
            );

            const data = [
              {
                values,
                labels: labelsNames,
                type: "pie",
                hole: 0.35,
                name: "Procent udziału we włączonym świetle",
                textinfo: "label+percent",
                textposition: "inside",
                marker: {
                  colors: sliceColors,
                  line: {
                    color: isDark ? "rgba(0,0,0,0.35)" : "#ffffff",
                    width: 2,
                  },
                },
                hoverinfo: "label+percent+value",
                insidetextfont: { color: isDark ? "#f1f5f9" : "#1f2937" },
              },
            ];

            const layout = {
              paper_bgcolor: isDark ? "transparent" : "transparent",
              plot_bgcolor: isDark ? "transparent" : "transparent",
              title: {
                text: "Procent udziału we włączonym świetle",
                font: { size: 18, color: isDark ? "#e5e7eb" : "#111827" },
              },

              margin: { t: 30, b: 30, l: 30, r: 30 },
              uniformtext: { minsize: 12, mode: "hide" },
              showlegend: false,
              font: { color: isDark ? "#e5e7eb" : "#111827" },
            };

            Plotly.newPlot("myDiv2", data, layout, { responsive: true });
          })
          .catch((error) => {
            console.error("Błąd podczas generowania wykresu kołowego:", error);
            alertBox.style.display = "block";
            document.querySelector(".oaerror").innerHTML =
              "<strong>Uwaga</strong> - Wystąpił błąd podczas generowania wykresu kołowego. Sprawdź połączenie z bazą danych.";
            translatePage(getCookie("lang") || "pl");
          });
      }

      const isDarkMode = localStorage.getItem("theme") === "ciemny-motyw";

      const heatmapGradient = isDarkMode
        ? {
            0: "#1e1e1e", // bardzo ciemny
            0.25: "#5e60ce", // ciemny indygo
            0.5: "#3a0ca3", // głęboki fiolet
            0.75: "#7209b7", // intensywny purpurowy
            1: "#f72585", // róż-fuksja
          }
        : {
            0: "#ffffff", // jasny
            0.25: "#90e0ef", // błękit
            0.5: "#00b4d8", // nasycony turkus
            0.75: "#0077b6", // głęboki niebieski
            1: "#03045e", // granatowy
          };

      const heatmapInstance = h337.create({
        container: document.querySelector(".heatmap"),
        radius: 80,
        blur: 0.9,
        maxOpacity: 0.7,
        minOpacity: 0,
        gradient: heatmapGradient,
      });

      // USTAW: bazowe wymiary, dla których były mierzone współrzędne 'cords'
      const BASE_WIDTH = 874; // przykładowa szerokość referencyjna
      const BASE_HEIGHT = 649; // przykładowa wysokość referencyjna

      function generujHeatmape(endpoint) {
        const container = document.querySelector(".heatmap"); // kontener heatmapy
        if (!container) {
          console.error("Brak kontenera .heatmap");
          return;
        }

        const czujniki = generujNazwyCzujnikow(pietro);

        fetch(endpoint)
          .then((res) => res.json())
          .then((dane) => {
            const cords =
              pietro == 0
                ? [
                    [142, 198],
                    [550, 217],
                    [758, 216],
                  ]
                : [
                    [142, 198],
                    [550, 217],
                    [758, 216],
                    [144, 535],
                    [377, 537],
                    [557, 537],
                    [760, 537],
                  ];

            // Bieżące wymiary kontenera
            const rect = container.getBoundingClientRect();
            const scaleX = rect.width / BASE_WIDTH;
            const scaleY = rect.height / BASE_HEIGHT;

            let points = [];
            let j = 0,
              max = 0;

            for (let i = 0; i < czujniki.length; i += 2) {
              const rawValue = dane[czujniki[i]];
              const scaledX = Math.round(cords[j][0] * scaleX);
              const scaledY = Math.round(cords[j][1] * scaleY);

              // Skaluj też promień, żeby zachować proporcje
              const baseRadius = 80;
              const scaledRadius = Math.round(
                baseRadius * Math.sqrt((scaleX + scaleY) / 2)
              );

              points.push({
                x: scaledX,
                y: scaledY,
                value: rawValue,
                radius: scaledRadius,
              });

              if (max < rawValue) max = rawValue;
              if (j < cords.length - 1) j++;
            }

            heatmapInstance.setData({
              min: 0,
              max: max === 0 ? 100 : max,
              data: points,
            });
          })
          .catch((error) => {
            console.error("Błąd podczas generowania heatmapy:", error);
            alertBox.style.display = "block";
            document.querySelector(".oaerror").innerHTML =
              "<strong>Uwaga</strong> - Wystąpił błąd podczas generowania heatmapy. Sprawdź połączenie z bazą danych.";
            translatePage(getCookie("lang") || "pl");
          });

        // Reaguj na zmianę rozmiaru okna – przerysuj heatmapę
        // (debounce, żeby nie strzelać za często)
        if (!window.__heatmapResizeBound) {
          window.__heatmapResizeBound = true;
          let resizeTimer;
          window.addEventListener("resize", () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => generujHeatmape(endpoint), 150);
          });
        }
      }

      function toLocalISOString(date = new Date()) {
        const pad = (n) => String(n).padStart(2, "0");
        return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(
          date.getDate()
        )}T${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(
          date.getSeconds()
        )}`;
      }

      function getCookie(name) {
        let cname = name + "=";
        let decodedCookie = decodeURIComponent(document.cookie);
        let ca = decodedCookie.split(";");
        for (let i = 0; i < ca.length; i++) {
          let c = ca[i].trim();
          if (c.indexOf(cname) == 0) {
            return c.substring(cname.length, c.length);
          }
        }
        return "";
      }

      function generujWykres(endpoint) {
        const czujniki = generujNazwyCzujnikow(pietro);
        fetch(endpoint)
          .then((res) => res.json())
          .then((dane) => {
            const container = document.getElementById("myPlot");
            container.innerHTML = "";

            if (!cookie) {
              console.error("Brak ciasteczka dla piętra: " + pietro);
              return;
            }

            const isDark = localStorage.getItem("theme") === "ciemny-motyw";

            const sensorNames = czujniki.map((key) => parsedCookie[key] || key);

            const darkColors = [
              "#ff6361",
              "#bc5090",
              "#ffa600",
              "#58508d",
              "#ff9478",
              "#8d5fd3",
              "#ffd66b",
              "#7072ab",
              "#f38f8f",
              "#b07acb",
            ];
            const lightColors = [
              "#d7263d",
              "#f46036",
              "#ffc43d",
              "#2e294e",
              "#1b998b",
              "#3f72af",
              "#ff9f1c",
              "#335c67",
              "#ffcad4",
              "#8479e1",
            ];

            const sensorColors = isDark ? darkColors : lightColors;
            const bgPlot = isDark ? "#121212" : "#f9fafb";
            const bgPaper = isDark ? "#1e1e1e" : "#ffffff";
            const fontColor = isDark ? "#e0e0e0" : "#333";
            const gridColor = isDark ? "#2c2c2c" : "#e0e0e0";

            for (let i = 0; i < czujniki.length; i++) {
              const sensorKey = czujniki[i];
              const plotDiv = document.createElement("div");
              plotDiv.id = "plotSensor" + (i + 1);
              plotDiv.className = "plotSensor";
              plotDiv.style.margin = "1%";
              plotDiv.style.height = "400px";
              plotDiv.style.float = "left";
              plotDiv.style.marginBottom = "20px";
              container.appendChild(plotDiv);

              const trace = {
                x: dane["data"],
                y: dane[sensorKey],
                mode: "lines",
                name: sensorNames[i],
                line: {
                  shape: "hv",
                  color: sensorColors[i % sensorColors.length],
                  width: 2,
                },
                fill: "tonexty",
                fillcolor: "rgba(255, 255, 255, 0.04)",
              };

              const layout = {
                paper_bgcolor: bgPaper,
                plot_bgcolor: bgPlot,
                title: {
                  text: sensorNames[i],
                  font: { size: 22, color: fontColor },
                },
                xaxis: {
                  title: "Oś X",
                  gridcolor: gridColor,
                  tickfont: { color: fontColor },
                  titlefont: { color: fontColor },
                },
                yaxis: {
                  title: "Oś Y",
                  gridcolor: gridColor,
                  tickfont: { color: fontColor },
                  titlefont: { color: fontColor },
                },
                font: { color: fontColor },
              };

              Plotly.newPlot(plotDiv.id, [trace], layout, {
                responsive: true,
              });
            }
          })
          .catch((error) => {
            console.error("Błąd podczas generowania wykresu:", error);
            alertBox.style.display = "block";
            document.querySelector(".oaerror").innerHTML =
              "<strong>Uwaga</strong> - Wystąpił błąd podczas generowania wykresu. Sprawdź połączenie z bazą danych.";
            translatePage(getCookie("lang") || "pl");
          });
      }
    </script>
    <script src="../js/dark_mode.js"></script>
    <script>
      mapa_swiatla = document.getElementById("mapa-swiatla");
      if (document.body.classList.contains("ciemny")) {
        mapa_swiatla.src = "../img_main/mapy/swiatla-bg-dark.png";
      }
    </script>
  </body>
</html>
