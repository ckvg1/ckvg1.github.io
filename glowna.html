      <div id="logo_settings">

          onclick="window.location.reload()"
          src="img_main/logo.svg"
          alt="Logo"
          class="logo"
          style="cursor: pointer"
        />
        <img
          loading="eager"
          onmouseover="hover(settings_icon)"
          onmouseleave="unhover(settings_icon)"
          src="./img_main/icony/settings.png"
          alt="Settings"
          id="settings_icon"
          class="jasny"
        />
      </div>

      <div class="hamburger" style="display: none">
        <div class="bar1"></div>
        <div class="bar2"></div>
        <div class="bar3"></div>
      </div>
      <script>
        window.addEventListener("load", () => {
          if (window.innerWidth < 810) {
            document.getElementsByClassName("hamburger")[0].style.display =
              "block";
            document.getElementsByClassName("tabs-list")[0].style.display =
              "none";
          }
        });
      </script>
      <nav class="tabs">
        <ul class="tabs-list">
          <li>
            <button

        <script>
          let pietro = 3;

          function zmienPietroUstawienia() {

              "none";
            document.getElementById("pietro3_urzadzenia").style.display =
              "none";

            let wybranePietroElement = document.getElementById(
              "pietro_settings_select"
            ).value;
            if (wybranePietroElement === "pietro0") {
              document.getElementById("pietro0_urzadzenia").style.display =
                "block";
              pietro = 0;
            } else if (wybranePietroElement === "pietro1") {
              document.getElementById("pietro1_urzadzenia").style.display =
                "block";
              pietro = 1;
            } else if (wybranePietroElement === "pietro2") {
              document.getElementById("pietro2_urzadzenia").style.display =
                "block";
              pietro = 2;
            } else if (wybranePietroElement === "pietro3") {
              document.getElementById("pietro3_urzadzenia").style.display =
                "block";
              pietro = 3;
            }
          }
          zmienPietroUstawienia();

          let language = getCookie("lang") || "pl"; // pobranie jezyka z cookies ajak nie ma to pl

          function zmienJezyk(lang) {
            language = lang;

            const flags = {
              pl: "poland_flag",
              de: "germany_flag",
              uk: "uk_flag",
              si: "silesia_flag",
            };

            for (const [key, id] of Object.entries(flags)) {
              document.getElementById(id).style.border =
                key === lang ? "2px solid red" : "none";
            }
          }

          //funkcja po nacisnieciu przycisku zapisz
          async function zapiszUstawienia() {
            const allLights = [
              "l0_1_1",
              "l0_1_2",
              "l0_2_1",
              "l0_2_2",
              "l0_3_1",
              "l0_3_2",
              "l1_1_1",
              "l1_1_2",
              "l1_2_1",
              "l1_2_2",
              "l1_3_1",
              "l1_3_2",
              "l1_4_1",
              "l1_4_2",
              "l1_5_1",
              "l1_5_2",
              "l1_6_1",
              "l1_6_2",
              "l1_7_1",
              "l1_7_2",
              "l2_1_1",
              "l2_1_2",
              "l2_2_1",
              "l2_2_2",
              "l2_3_1",
              "l2_3_2",
              "l2_4_1",
              "l2_4_2",
              "l2_5_1",
              "l2_5_2",
              "l2_6_1",
              "l2_6_2",
              "l2_7_1",
              "l2_7_2",
              "l3_1_1",
              "l3_1_2",
              "l3_2_1",
              "l3_2_2",
              "l3_3_1",
              "l3_3_2",
              "l3_4_1",
              "l3_4_2",
              "l3_5_1",
              "l3_5_2",
              "l3_6_1",
              "l3_6_2",
              "l3_7_1",
              "l3_7_2",
            ];
            document.cookie = `lang=${language}; path=/; max-age=31536000`; // ustawienie ciasteczka z jezykiem na rok

            const pietro0 = document.getElementById("pietro0_urzadzenia");
            const pietro1 = document.getElementById("pietro1_urzadzenia");
            const pietro2 = document.getElementById("pietro2_urzadzenia");
            const pietro3 = document.getElementById("pietro3_urzadzenia");
            const form0 = document.getElementById("settingsForm0");
            const form1 = document.getElementById("settingsForm1");
            const form2 = document.getElementById("settingsForm2");
            const form3 = document.getElementById("settingsForm3");

            const modal = document.getElementById("settingsModal");
            if (pietro == 0) {
              const data0 = new FormData(form0);
              setCookie("pietro0", JSON.stringify(Object.fromEntries(data0)));
            }
            if (pietro == 1) {
              const data1 = new FormData(form1);
              //console.log(
              //  "Zapisano ustawienia dla Piętro 1:",
              //  Object.fromEntries(data1)
              //);
              setCookie("pietro1", JSON.stringify(Object.fromEntries(data1)));
            } else if (pietro == 2) {
              const data2 = new FormData(form2);
              //console.log(
              //  "Zapisano ustawienia dla Piętro 2:",
              //  Object.fromEntries(data2)
              //);

              //  "Zapisano ustawienia dla Piętro 3:",
              //  Object.fromEntries(data3)
              //);
              setCookie("pietro3", JSON.stringify(Object.fromEntries(data3)));
            }

            let harmonogram = {};
            for (let i = 0; i < allLights.length; i++) {
              const light = allLights[i];
              // console.log("Sprawdzam światło:", light);
              const el = document.getElementById(`${light}_time`);
              if (el) {
                const time = el.value;
                if (time) {
                  harmonogram[light] = time;
                } else {
                  harmonogram[light] = "";
                }
              }
            }

            //console.log("Harmonogram:", harmonogram);

            if (Object.keys(harmonogram).length > 0) {
              ustawHarmonogram(harmonogram);
            }
            modal.style.display = "none"; // zamknij modal po zapisaniu
            window.location.reload(); // odśwież stronę, aby zastosować zmiany
          }
          async function ustawHarmonogram(harmonogram = null) {
            if (harmonogram === null) {
              const godzinaInput = document.getElementById(
                `harmonogramGodzinaInput`
              );
              const godzina = godzinaInput.value;
              harmonogram = {
                all_OFF_l3: `${godzina}`,
                all_OFF_l2: `${godzina}`,
              };
              await axios.put(
                `${window.config.apiBaseUrl}/harmonogram/add`,
                harmonogram
              );
            } else {
              await axios.put(
                `${window.config.apiBaseUrl}/harmonogram/add`,

                harmonogram
              );
            }
          }
          function setCookie(name, value) {
            const d = new Date();
            d.setFullYear(d.getFullYear() + 1000); // dodaj 1000 lat

            const expires = "expires=" + d.toUTCString();
            //console.log("Ciasteczko wygasnie:", expires);
            document.cookie =
              name +
              "=" +
              encodeURIComponent(value) +
              ";" +
              expires +
              ";path=/";
          }

          //deafulowe wartosci zeby utworzyc ciasteczka

          //dla parteru - pietra0 reczne ustawienie wartosci ze wzgledu na inna strukture
          const default0 = {
            l0_1_1: "0_1_1",
            l0_1_2: "0_1_2",
            l0_2_1: "0_2_1",
            l0_2_2: "0_2_2",
            l0_3_1: "0_3_1",
            l0_3_2: "0_3_2",
            t0_1: "t0_1",
            t0_2: "t0_2",
            t0_3: "t0_3",
            r0_1: "r0_1",
            r0_2: "r0_2",
            r0_3: "r0_3",
          };
          function createDefault(floor) {
            const obj = {};

            // Swiatla: lX_Y_Z
            for (let y = 1; y <= 7; y++) {
              for (let z = 1; z <= 2; z++) {
                obj[`l${floor}_${y}_${z}`] = `${floor}_${y}_${z}`;
              }
            }

            // Temperatura: tX_Y
            for (let y = 1; y <= 7; y++) {
              obj[`t${floor}_${y}`] = `t${floor}_${y}`;
            }

            // Pokoj: rX_Y
            for (let y = 1; y <= 7; y++) {
              obj[`r${floor}_${y}`] = `r${floor}_${y}`;
            }

            return obj;
          }

          // Tworzenie obiektów
          const default1 = createDefault(1);
          const default2 = createDefault(2);
          const default3 = createDefault(3);

          function getCookie(name) {
            let cname = name + "=";
            let decodedCookie = decodeURIComponent(document.cookie);
            let ca = decodedCookie.split(";");
            for (let i = 0; i < ca.length; i++) {
              let c = ca[i].trim();
              if (c.indexOf(cname) == 0) {
                return c.substring(cname.length, c.length);
              }
            }
            return "";
          }

          function resetujNazwy() {
            [default0, default1, default2, default3].forEach((def, i) =>
              setCookie(`pietro${i}`, JSON.stringify(def))
            );
            //odwiez zeby zastosowac zmiany
            window.location.reload();
          }

          // Sprawdzenie ciasteczek i ustawienie domyślnych wartości
          [default0, default1, default2, default3].forEach((def, i) => {
            if (!getCookie(`pietro${i}`)) {
              setCookie(`pietro${i}`, JSON.stringify(def));
            }
          });

          // Odczyt ciasteczek i ustawienie wartości w formularzach
          document.addEventListener("DOMContentLoaded", () => {
            ["pietro0", "pietro1", "pietro2", "pietro3"].forEach((p) => {
              const cookieData = getCookie(p);
              if (cookieData) {
                try {
                  const parsed = JSON.parse(cookieData);
                  Object.entries(parsed).forEach(([key, value]) => {
                    const input = document.getElementById(key);
                    if (input) {
                      input.value = value;
                    }
                  });
                } catch (e) {
                  console.warn("Błąd odczytu ciasteczka dla", p, e);
                }
              }
            });
            wczytajHarmonogram();
          });
          async function wczytajHarmonogram() {
            try {
              const harmonogram = await axios.get(
                `${window.config.apiBaseUrl}/harmonogram`
              );
              Object.entries(harmonogram["data"]).forEach(([key, value]) => {
                const el = document.getElementById(`${key}_time`);
                if (el) {
                  el.value = value;
                } else {
                }
              });
            } catch (error) {
              console.error(
                "Błąd podczas wczytywania harmonogramu, upewnij się, ze jestes polaczony z serwerem.",
                error
              );
            }
          }
        </script>

    <script>
      const modal = document.getElementById("settingsModal");
      const settingsIcon = document.getElementById("settings_icon");
      const modal_content = document.querySelector(".modal-content");
      function closeModal() {
        modal.style.display = "none";
      }
      function settingsF(event) {
        if (settingsIcon.contains(event.target)) {
          modal.style.display = "flex";
          wczytajHarmonogram();

          closeModal();

    <script>
      function logoF() {
        const logo = document.querySelector(".logo");
        const ramka = document.querySelector("iframe");
        const sterowanieUrl = new URL(ramka.src).pathname
          .split("/")
          .filter(Boolean)
          .pop();
        const jezyk = getCookie("lang");
        const ciemny = document.body.classList.contains("ciemny");
        const sterowaniePages = [
          "sterowanie0.html",
          "sterowanie1.html",
          "sterowanie2.html",
          "sterowanie3.html",
        ];
        const isSterowanie = sterowaniePages.includes(sterowanieUrl);

        let src = "img_main/logo.svg";

        if (window.innerWidth <= 810) {
          src = "img_main/logo.png";
        } else if (isSterowanie) {
          if (jezyk === "si") {
            src = ciemny
              ? "img_main/logoFamilok-dark.svg"
              : "img_main/logoFamilok.svg";
          } else {
            src = ciemny
              ? "img_main/logoTower-dark.svg"
              : "img_main/logoTower.svg";
          }
        } else {
          src = ciemny ? "img_main/logo-dark.svg" : "img_main/logo.svg";
        }

        logo.src = src;
      }
      //Wywolanie funkcji przy zmainei rozmiaru, ladowaniu i kliknieciu
      ["resize", "load", "click"].forEach((event) =>
        window.addEventListener(event, logoF)
      );
    </script>
